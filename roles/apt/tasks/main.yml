---
- name: Install packages
  ansible.builtin.apt:
    name: "{{ packages | default([], true) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# Into ~/.local/bin, the only user dir startw puts on PATH
- name: Install cargo packages
  ansible.builtin.command:
    cmd: "cargo install --locked --root /home/{{ user }}/.local {{ item }}"
    creates: "/home/{{ user }}/.local/bin/{{ item.split('@') | first }}"
  environment: "{{ user_env | combine({'CARGO_HOME': '/home/' ~ user ~ '/.local/share/cargo'}) }}"
  loop: "{{ cargo_packages | default([], true) }}"
  become: true
  become_user: "{{ user }}"
