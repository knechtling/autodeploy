---
- name: Check if dotfiles repository exists
  ansible.builtin.stat:
    path: "{{ dotfiles_dir }}/.git"
  register: dotfiles_repo_stat
  become: true
  become_user: "{{ user }}"

- name: Check dotfiles repository working tree state
  ansible.builtin.command: git -C "{{ dotfiles_dir }}" status --porcelain
  register: dotfiles_repo_status
  changed_when: false
  when: dotfiles_repo_stat.stat.exists
  become: true
  become_user: "{{ user }}"

- name: Fail when dotfiles repository has uncommitted changes
  ansible.builtin.fail:
    msg: >-
      Dotfiles repository at {{ dotfiles_dir }} has uncommitted or untracked changes.
      Commit/stash/discard local changes, then rerun sync.
  when:
    - dotfiles_repo_stat.stat.exists
    - dotfiles_repo_status.stdout | trim | length > 0

- name: Ensure dotfiles origin remote exists and points to configured repo
  ansible.builtin.shell: |
    if git -C "{{ dotfiles_dir }}" remote | grep -qx origin; then
      git -C "{{ dotfiles_dir }}" remote set-url origin "{{ dotfiles_repo }}"
    else
      git -C "{{ dotfiles_dir }}" remote add origin "{{ dotfiles_repo }}"
    fi
  args:
    executable: /bin/bash
  changed_when: false
  when: dotfiles_repo_stat.stat.exists
  become: true
  become_user: "{{ user }}"

- name: Ensure dotfiles repository is present
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    version: "{{ dotfiles_branch }}"
    dest: "{{ dotfiles_dir }}"
    update: true
    force: false
  become: true
  become_user: "{{ user }}"
  environment: "{{ user_env }}"

- name: Create zsh cache dir
  ansible.builtin.file:
    path: "/home/{{ user }}/.cache/zsh"
    mode: '0700'
    owner: "{{ user }}"
    group: "{{ user_group }}"
    state: directory
    recurse: true
  become: true

- name: Stow dotfiles into home directory
  ansible.builtin.command:
    argv: "{{ ['stow', '-d', dotfiles_dir ~ '/packages', '-t', '/home/' ~ user,
               '--dotfiles', '--no-folding', '-v'] + dotfiles_stow_packages }}"
  register: dotfiles_stow_result
  changed_when: dotfiles_stow_result.stderr is search('^LINK', multiline=true)
  become: true
  become_user: "{{ user }}"
