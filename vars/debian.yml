  - brightnessctl
  - upower
  - power-profiles-daemon
  - network-manager-applet
  - network-manager-openvpn-gnome
  - network-manager-openconnect-gnome
  - network-manager-vpnc-gnome
  - network-manager-strongswan
  - wireguard-tools
  - bluez
  - blueman
  - policykit-1-gnome
  - udiskie
  - wdisplays
  - pavucontrol
  - zenity
  # audio
  - pipewire
  - wireplumber
  - pipewire-pulse
  - pipewire-alsa
  - pulsemixer
  # fonts
  - fonts-dejavu
  - fonts-liberation
  - fonts-noto-core
  - fonts-noto-color-emoji
  - fonts-font-awesome
  - fonts-linuxlibertine
  # apps
  - mpv
  - imv
  - zathura
  - zathura-pdf-poppler
  - fzf
  - bat
  - htop
  - rsync
  - unzip
  - ffmpeg
  - ffmpegthumbnailer
  - man-db
  - socat
  - moreutils
  - yt-dlp
  - ncdu
