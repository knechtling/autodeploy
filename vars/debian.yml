  - xdg-desktop-portal-wlr
  - xwayland
  - qtwayland5
  - qt6-wayland
  # wayland userland
  - foot
  - waybar
  - bemenu
  - wmenu
  - rofi
  - mako-notifier
  - swaybg
  - swayidle
  - swaylock
  - swayosd
  - grim
  - slurp
  - wl-clipboard
  - cliphist
  - wf-recorder
  - kanshi
  - wlr-randr
  - wtype
  - libnotify-bin
  - psmisc
  # desktop services GNOME would provide (see group_vars/all.yml)
